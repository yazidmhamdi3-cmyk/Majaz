<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مجاز | الصفحة الرئيسية</title>
    <!-- الخطوط والأيقونات -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- إطار العمل Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Cairo', 'sans-serif'] },
                    colors: {
                        primary: '#6b21a8',
                        primaryDark: '#4c1d95',
                        secondary: '#fbbf24',
                        dark: '#1e1b4b'
                    }
                }
            }
        }
    </script>
    <style>
        .hidden-app { display: none !important; }
        .tab-btn.active { color: #fbbf24; border-bottom-color: #fbbf24; }
        .tab-btn { color: #cbd5e1; border-bottom-color: transparent; }
        .img-overlay { background: linear-gradient(to top, rgba(76, 29, 149, 0.9) 0%, rgba(107, 33, 168, 0.4) 50%, rgba(0,0,0,0) 100%); }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen flex flex-col selection:bg-secondary selection:text-primaryDark">

    <!-- ================= الشاشة الرئيسية (الترحيب) ================= -->
    <div class="flex-1 flex flex-col relative bg-gradient-to-br from-primaryDark to-primary overflow-hidden pb-12">
        
        <div class="absolute top-[-20%] left-[-10%] w-96 h-96 bg-secondary rounded-full blur-[100px] opacity-20"></div>
        <div class="absolute bottom-[-10%] right-[-5%] w-80 h-80 bg-purple-400 rounded-full blur-[100px] opacity-20"></div>

        <!-- شريط التنقل -->
        <nav class="container mx-auto px-8 py-6 flex justify-between items-center relative z-10">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-passport text-4xl text-secondary"></i>
                <span class="text-4xl font-black text-white tracking-wider" data-i18n="logo">مجاز</span>
            </div>
            
            <!-- مبدل اللغة -->
            <div class="relative">
                <select id="langSwitcher" onchange="changeLanguage(this.value)" class="bg-white/10 text-white border border-white/30 rounded-lg px-3 py-1.5 outline-none backdrop-blur-sm cursor-pointer hover:bg-white/20 transition">
                    <option value="ar" class="text-slate-800">العربية</option>
                    <option value="en" class="text-slate-800">English</option>
                    <option value="fr" class="text-slate-800">Français</option>
                </select>
            </div>
        </nav>

        <!-- القسم الأوسط (النصوص) -->
        <div class="container mx-auto px-8 text-center relative z-10 mt-8 mb-12">
            <span class="inline-block py-1.5 px-4 rounded-full bg-white/10 text-secondary font-bold text-sm mb-6 border border-white/20 backdrop-blur-sm" data-i18n="badge">
                ✨ المنصة الأولى للعمل المجتمعي
            </span>
            <h1 class="text-5xl lg:text-7xl font-black text-white leading-tight mb-4 drop-shadow-lg">
                <span data-i18n="hero_title_1">بوابتك للأثر..</span> <span class="text-secondary" data-i18n="hero_title_2">ولمستقبلك المهني</span>
            </h1>
            <p class="text-xl text-purple-100 max-w-2xl mx-auto leading-relaxed" data-i18n="hero_desc">
                حدد صفتك أدناه للدخول إلى المنصة. صور حية، توثيق معتمد، ومجتمع ينبض بالعطاء.
            </p>
        </div>

        <!-- === بطاقات الدخول المصورة === -->
        <div class="container mx-auto px-6 grid grid-cols-1 md:grid-cols-3 gap-8 max-w-6xl relative z-10">
            
            <!-- 1. بطاقة المتطوع -->
            <div onclick="openAuth('volunteer')" class="group relative h-80 rounded-[2rem] overflow-hidden cursor-pointer shadow-2xl hover:-translate-y-3 transition duration-300 border-4 border-transparent hover:border-secondary">
                <img src="https://images.unsplash.com/photo-1593113563332-e147ce10cb14?auto=format&fit=crop&w=600&q=80" alt="Volunteer" class="absolute inset-0 w-full h-full object-cover group-hover:scale-110 transition duration-500">
                <div class="absolute inset-0 img-overlay transition duration-300 group-hover:bg-primaryDark/50"></div>
                <div class="absolute inset-0 p-6 flex flex-col justify-end items-center text-center pb-10">
                    <div class="w-20 h-20 bg-secondary/90 backdrop-blur-sm rounded-full flex items-center justify-center mb-4 shadow-lg group-hover:scale-110 transition">
                        <i class="fa-solid fa-hand-holding-heart text-4xl text-primaryDark"></i>
                    </div>
                    <h3 class="text-3xl font-black text-white mb-2" data-i18n="vol_title">دخول كـ متطوع</h3>
                </div>
            </div>

            <!-- 2. بطاقة الجمعية -->
            <div onclick="openAuth('association')" class="group relative h-80 rounded-[2rem] overflow-hidden cursor-pointer shadow-2xl hover:-translate-y-3 transition duration-300 border-4 border-transparent hover:border-secondary">
                <img src="https://images.unsplash.com/photo-1559027615-cd4628902d4a?auto=format&fit=crop&w=600&q=80" alt="Association" class="absolute inset-0 w-full h-full object-cover group-hover:scale-110 transition duration-500">
                <div class="absolute inset-0 img-overlay transition duration-300 group-hover:bg-primaryDark/50"></div>
                <div class="absolute inset-0 p-6 flex flex-col justify-end items-center text-center pb-10">
                    <div class="w-20 h-20 bg-white/90 backdrop-blur-sm rounded-full flex items-center justify-center mb-4 shadow-lg group-hover:scale-110 transition">
                        <i class="fa-solid fa-building-ngo text-4xl text-primary"></i>
                    </div>
                    <h3 class="text-3xl font-black text-white mb-2" data-i18n="assoc_title">دخول كـ جمعية</h3>
                </div>
            </div>

            <!-- 3. بطاقة الإدارة -->
            <div onclick="openAuth('admin')" class="group relative h-80 rounded-[2rem] overflow-hidden cursor-pointer shadow-2xl hover:-translate-y-3 transition duration-300 border-4 border-transparent hover:border-secondary">
                <img src="https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?auto=format&fit=crop&w=600&q=80" alt="Admin" class="absolute inset-0 w-full h-full object-cover group-hover:scale-110 transition duration-500">
                <div class="absolute inset-0 img-overlay transition duration-300 group-hover:bg-primaryDark/50"></div>
                <div class="absolute inset-0 p-6 flex flex-col justify-end items-center text-center pb-10">
                    <div class="w-20 h-20 bg-dark/80 backdrop-blur-sm rounded-full flex items-center justify-center mb-4 shadow-lg border border-white/20 group-hover:scale-110 transition">
                        <i class="fa-solid fa-shield-halved text-4xl text-white"></i>
                    </div>
                    <h3 class="text-3xl font-black text-white mb-2" data-i18n="admin_title">إدارة المنصة</h3>
                </div>
            </div>
        </div>
    </div>

    <!-- نافذة تسجيل الدخول / حساب جديد -->
    <div id="authModal" class="fixed inset-0 bg-dark/80 backdrop-blur-md z-50 hidden-app flex items-center justify-center p-4" dir="rtl">
        <div class="bg-primaryDark rounded-3xl shadow-2xl w-full max-w-md overflow-hidden relative border border-white/10">
            <button onclick="closeAuth()" class="absolute top-4 rtl:left-4 ltr:right-4 text-white/50 hover:text-white transition text-2xl z-10" id="closeBtn">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div class="text-center pt-8 pb-4">
                <i id="authIcon" class="text-5xl text-secondary mb-3"></i>
                <h2 id="authTitle" class="text-2xl font-black text-white"></h2>
            </div>
            <div id="tabsContainer" class="flex border-b border-white/10 mb-6 px-6">
                <button id="tabLogin" onclick="switchTab(true)" class="tab-btn active flex-1 py-3 font-bold border-b-4 transition">تسجيل دخول</button>
                <button id="tabSignup" onclick="switchTab(false)" class="tab-btn flex-1 py-3 font-bold border-b-4 transition">حساب جديد</button>
            </div>
            <div class="px-8 pb-8 space-y-4">
                <div id="nameField" class="hidden-app">
                    <input type="text" id="inpName" class="w-full bg-white/10 border border-white/20 text-white placeholder-white/50 rounded-xl py-3 px-4 focus:outline-none focus:border-secondary transition" placeholder="الاسم الكامل / اسم الجهة">
                </div>
                <div>
                    <input type="email" id="inpEmail" class="w-full bg-white/10 border border-white/20 text-white placeholder-white/50 rounded-xl py-3 px-4 focus:outline-none focus:border-secondary transition" placeholder="البريد الإلكتروني">
                </div>
                <div>
                    <input type="password" id="inpPass" class="w-full bg-white/10 border border-white/20 text-white placeholder-white/50 rounded-xl py-3 px-4 focus:outline-none focus:border-secondary transition" placeholder="كلمة المرور">
                </div>
                <div id="authMsg" class="text-center text-sm font-bold mt-2"></div>
                <button onclick="processAuth()" id="submitBtn" class="w-full mt-6 bg-secondary text-primaryDark font-black py-4 rounded-xl hover:bg-yellow-400 transition shadow-lg shadow-yellow-500/20 text-lg">
                    دخول
                </button>
            </div>
        </div>
    </div>

    <!-- السكريبت للتحكم بالتسجيل وتوجيه الصفحات -->
    <script>
        let users = JSON.parse(localStorage.getItem('majaz_users')) || [];
        let currentRole = ''; 
        let isLogin = true;

        function openAuth(role) {
            currentRole = role;
            document.getElementById('authModal').classList.remove('hidden-app');
            let iconEl = document.getElementById('authIcon');
            iconEl.className = role === 'volunteer' ? "fa-solid fa-hand-holding-heart text-5xl text-secondary mb-3" : (role === 'association' ? "fa-solid fa-building-ngo text-5xl text-secondary mb-3" : "fa-solid fa-shield-halved text-5xl text-secondary mb-3");

            if(role === 'admin') {
                document.getElementById('tabsContainer').classList.add('hidden-app');
                switchTab(true); 
            } else {
                document.getElementById('tabsContainer').classList.remove('hidden-app');
                switchTab(true);
            }
        }

        function closeAuth() {
            document.getElementById('authModal').classList.add('hidden-app');
        }

        function switchTab(loginMode) {
            isLogin = loginMode;
            document.getElementById('authMsg').innerText = '';
            document.getElementById('authTitle').innerText = (isLogin ? 'دخول كـ ' : 'إنشاء حساب كـ ') + (currentRole === 'volunteer' ? 'متطوع' : (currentRole === 'association' ? 'جمعية' : 'إدارة'));
            document.getElementById('submitBtn').innerText = isLogin ? 'الدخول للمنصة' : 'إنشاء الحساب';

            if(isLogin) {
                document.getElementById('tabLogin').classList.add('active');
                document.getElementById('tabSignup').classList.remove('active');
                document.getElementById('nameField').classList.add('hidden-app');
            } else {
                document.getElementById('tabSignup').classList.add('active');
                document.getElementById('tabLogin').classList.remove('active');
                document.getElementById('nameField').classList.remove('hidden-app');
            }
        }

        function processAuth() {
            let email = document.getElementById('inpEmail').value.trim();
            let pass = document.getElementById('inpPass').value.trim();
            let name = document.getElementById('inpName').value.trim();

            if(!email || !pass) {
                document.getElementById('authMsg').innerText = "يرجى تعبئة الحقول المطلوبة";
                document.getElementById('authMsg').className = "text-center text-sm font-bold mt-2 text-red-400";
                return;
            }

            if(currentRole === 'admin') {
                // دخول كإدارة
                localStorage.setItem('majaz_session', JSON.stringify({role: 'admin', name: 'المدير العام'}));
                window.location.href = 'admin.html';
                return;
            }

            if(isLogin) {
                // تسجيل دخول
                let user = users.find(u => u.role === currentRole && u.email === email && u.pass === pass);
                if(user) {
                    localStorage.setItem('majaz_session', JSON.stringify(user));
                    window.location.href = user.role === 'volunteer' ? 'volunteer.html' : 'association.html';
                } else {
                    document.getElementById('authMsg').innerText = "البيانات غير صحيحة أو الحساب غير موجود";
                    document.getElementById('authMsg').className = "text-center text-sm font-bold mt-2 text-red-400";
                }
            } else {
                // حساب جديد
                if(users.find(u => u.email === email)) {
                    document.getElementById('authMsg').innerText = "هذا البريد مستخدم مسبقاً";
                    document.getElementById('authMsg').className = "text-center text-sm font-bold mt-2 text-red-400";
                    return;
                }
                let newUser = { id: Date.now(), role: currentRole, name: name, email: email, pass: pass, hours: 0 };
                users.push(newUser);
                localStorage.setItem('majaz_users', JSON.stringify(users));
                localStorage.setItem('majaz_session', JSON.stringify(newUser));
                
                document.getElementById('authMsg').innerText = "تم الإنشاء! جاري الدخول...";
                document.getElementById('authMsg').className = "text-center text-sm font-bold mt-2 text-green-400";
                
                setTimeout(() => {
                    window.location.href = newUser.role === 'volunteer' ? 'volunteer.html' : 'association.html';
                }, 1000);
            }
        }

        // التوجيه التلقائي لمن سجل دخوله مسبقاً
        window.onload = () => {
            let session = JSON.parse(localStorage.getItem('majaz_session'));
            if(session) {
                if(session.role === 'volunteer') window.location.href = 'volunteer.html';
                if(session.role === 'association') window.location.href = 'association.html';
                if(session.role === 'admin') window.location.href = 'admin.html';
            }
        }
    </script>
</body>
</html>
