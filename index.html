<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مجاز | الصفحة الرئيسية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Cairo', 'sans-serif'] },
                    colors: {
                        primary: '#4c1d95', 
                        secondary: '#f59e0b', 
                        dark: '#1e1b4b'
                    }
                }
            }
        }
    </script>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4c1d95">
    
    <style>
        .hidden-app { display: none !important; }
        .tab-btn.active { color: #f59e0b; border-bottom-color: #f59e0b; }
        .tab-btn { color: #cbd5e1; border-bottom-color: transparent; }
        .img-overlay { background: linear-gradient(to top, rgba(46, 16, 101, 0.95) 0%, rgba(76, 29, 149, 0.5) 50%, rgba(0,0,0,0) 100%); }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen flex flex-col selection:bg-secondary selection:text-white">

    <div class="flex-1 flex flex-col relative overflow-hidden pb-12 bg-gradient-to-br from-[#2e1065] via-[#581c87] to-[#1e1b4b]">
        
        <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-secondary rounded-full blur-[130px] opacity-20 z-0 pointer-events-none"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[500px] h-[500px] bg-[#8b5cf6] rounded-full blur-[130px] opacity-15 z-0 pointer-events-none"></div>

        <div class="absolute inset-0 z-0 pointer-events-none opacity-[0.03]" style="background-image: url('logo.jpg'); background-size: 150px; background-repeat: repeat;"></div>

        <nav class="w-full px-6 py-5 flex justify-between items-center relative z-10">
            <div class="flex items-center gap-3 md:gap-4">
                
                <div class="w-24 h-24 md:w-32 md:h-32 flex items-center justify-center relative">
                    <img src="logo.jpg" alt="شعار مجاز" class="w-full h-full object-contain drop-shadow-2xl">
                </div>
                
                <span class="text-3xl md:text-5xl font-black text-white tracking-wider mt-1 drop-shadow-md">مجاز</span>
            </div>
            
            <div class="flex items-center gap-3">
                <button onclick="openAuth('admin')" class="flex items-center gap-2 bg-white/10 hover:bg-white/20 text-white border border-white/20 rounded-lg px-3 py-2 md:px-5 md:py-3 backdrop-blur-md transition text-xs md:text-sm font-bold shadow-lg">
                    <i class="fa-solid fa-shield-halved text-secondary"></i>
                    <span>الإدارة</span>
                </button>
            </div>
        </nav>

        <div class="container mx-auto px-6 text-center relative z-10 mt-2 md:mt-6 mb-10 md:mb-12">
            <span class="inline-block py-1.5 px-5 rounded-full bg-black/10 text-secondary font-bold text-xs md:text-sm mb-6 border border-secondary/30 backdrop-blur-md shadow-lg">
                ✨ المنصة الأولى للعمل المجتمعي
            </span>
            <h1 class="text-4xl md:text-6xl lg:text-7xl font-black text-white leading-tight mb-4 drop-shadow-2xl">
                بوابتك للأثر.. <span class="text-secondary block md:inline mt-2 md:mt-0">ولمستقبلك المهني</span>
            </h1>
            <p class="text-base md:text-lg text-purple-100 max-w-2xl mx-auto leading-relaxed drop-shadow-md font-medium mt-4">
                حدد صفتك أدناه للدخول إلى المنصة. صور حية، توثيق معتمد، ومجتمع ينبض بالعطاء.
            </p>
        </div>

        <div class="container mx-auto px-6 flex flex-col md:flex-row justify-center items-center gap-6 md:gap-8 max-w-4xl relative z-10">
            
            <div onclick="openAuth('volunteer')" class="w-full md:w-1/2 group relative h-72 md:h-96 rounded-3xl overflow-hidden cursor-pointer shadow-2xl hover:-translate-y-2 transition duration-300 border-2 border-white/10 hover:border-secondary">
                <img src="https://images.unsplash.com/photo-1582213782179-e0d53f98f2ca?auto=format&fit=crop&w=800&q=80" alt="Volunteer" class="absolute inset-0 w-full h-full object-cover group-hover:scale-105 transition duration-500">
                <div class="absolute inset-0 img-overlay transition duration-300 group-hover:bg-primaryDark/80"></div>
                <div class="absolute inset-0 p-6 flex flex-col justify-end items-center text-center pb-10">
                    <div class="w-16 h-16 md:w-20 md:h-20 bg-secondary/95 backdrop-blur-sm rounded-full flex items-center justify-center mb-4 shadow-[0_0_20px_rgba(251,191,36,0.4)] group-hover:scale-110 transition duration-300">
                        <i class="fa-solid fa-hand-holding-heart text-3xl md:text-4xl text-primaryDark"></i>
                    </div>
                    <h3 class="text-2xl md:text-3xl font-black text-white mb-1">دخول كـ متطوع</h3>
                    <p class="text-white/80 font-bold text-xs md:text-sm">ابنِ سيرتك الذاتية ووثق ساعاتك</p>
                </div>
            </div>

            <div onclick="openAuth('association')" class="w-full md:w-1/2 group relative h-72 md:h-96 rounded-3xl overflow-hidden cursor-pointer shadow-2xl hover:-translate-y-2 transition duration-300 border-2 border-white/10 hover:border-secondary">
                <img src="https://images.unsplash.com/photo-1531206715517-5c0ba140b2b8?auto=format&fit=crop&w=800&q=80" alt="Association" class="absolute inset-0 w-full h-full object-cover group-hover:scale-105 transition duration-500">
                <div class="absolute inset-0 img-overlay transition duration-300 group-hover:bg-primaryDark/80"></div>
                <div class="absolute inset-0 p-6 flex flex-col justify-end items-center text-center pb-10">
                    <div class="w-16 h-16 md:w-20 md:h-20 bg-white/95 backdrop-blur-sm rounded-full flex items-center justify-center mb-4 shadow-[0_0_20px_rgba(255,255,255,0.2)] group-hover:scale-110 transition duration-300">
                        <i class="fa-solid fa-building-ngo text-3xl md:text-4xl text-primary"></i>
                    </div>
                    <h3 class="text-2xl md:text-3xl font-black text-white mb-1">دخول كـ جمعية</h3>
                    <p class="text-white/80 font-bold text-xs md:text-sm">انشر فرصك وأدر المتطوعين باحترافية</p>
                </div>
            </div>

        </div>
    </div>

    <div id="authModal" class="fixed inset-0 bg-dark/90 backdrop-blur-md z-50 hidden-app flex items-center justify-center p-4" dir="rtl">
        <div class="bg-white rounded-[2rem] shadow-2xl w-full max-w-md overflow-hidden relative border border-slate-100">
            <button onclick="closeAuth()" class="absolute top-5 rtl:left-5 ltr:right-5 text-slate-400 hover:text-red-500 transition text-2xl z-10 w-8 h-8 bg-slate-100 rounded-full flex items-center justify-center">
                <i class="fa-solid fa-xmark text-sm"></i>
            </button>
            <div class="text-center pt-10 pb-6 bg-slate-50 border-b border-slate-100">
                <i id="authIcon" class="text-5xl text-primary mb-3"></i>
                <h2 id="authTitle" class="text-2xl font-black text-slate-800"></h2>
            </div>
            <div id="tabsContainer" class="flex border-b border-slate-200 mb-6 px-6 bg-slate-50">
                <button id="tabLogin" onclick="switchTab(true)" class="tab-btn active flex-1 py-4 font-bold border-b-4 transition">تسجيل دخول</button>
                <button id="tabSignup" onclick="switchTab(false)" class="tab-btn flex-1 py-4 font-bold border-b-4 transition">حساب جديد</button>
            </div>
            <div class="px-8 pb-8 space-y-4">
                <div id="nameField" class="hidden-app">
                    <label class="block text-xs font-bold text-slate-500 mb-1">الاسم الكامل / اسم الجهة</label>
                    <input type="text" id="inpName" class="w-full bg-slate-50 border border-slate-200 text-slate-800 placeholder-slate-400 rounded-xl py-3.5 px-4 focus:outline-none focus:border-primary transition">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">البريد الإلكتروني</label>
                    <input type="email" id="inpEmail" class="w-full bg-slate-50 border border-slate-200 text-slate-800 placeholder-slate-400 rounded-xl py-3.5 px-4 focus:outline-none focus:border-primary transition">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">كلمة المرور</label>
                    <input type="password" id="inpPass" class="w-full bg-slate-50 border border-slate-200 text-slate-800 placeholder-slate-400 rounded-xl py-3.5 px-4 focus:outline-none focus:border-primary transition">
                </div>
                <div id="authMsg" class="text-center text-sm font-bold mt-2"></div>
                <button onclick="processAuth()" id="submitBtn" class="w-full mt-6 bg-primary text-white font-black py-4 rounded-xl hover:bg-primaryDark transition shadow-lg text-lg">
                    دخول
                </button>
            </div>
        </div>
    </div>

    <script>
        let users = JSON.parse(localStorage.getItem('majaz_users')) || [];
        let currentRole = ''; 
        let isLogin = true;

        function openAuth(role) {
            currentRole = role;
            document.getElementById('authModal').classList.remove('hidden-app');
            let iconEl = document.getElementById('authIcon');
            iconEl.className = role === 'volunteer' ? "fa-solid fa-hand-holding-heart text-5xl text-secondary mb-3" : (role === 'association' ? "fa-solid fa-building-ngo text-5xl text-primary mb-3" : "fa-solid fa-shield-halved text-5xl text-dark mb-3");

            if(role === 'admin') {
                document.getElementById('tabsContainer').classList.add('hidden-app');
                switchTab(true); 
            } else {
                document.getElementById('tabsContainer').classList.remove('hidden-app');
                switchTab(true);
            }
        }

        function closeAuth() {
            document.getElementById('authModal').classList.add('hidden-app');
        }

        function switchTab(loginMode) {
            isLogin = loginMode;
            document.getElementById('authMsg').innerText = '';
            document.getElementById('authTitle').innerText = (isLogin ? 'دخول كـ ' : 'إنشاء حساب كـ ') + (currentRole === 'volunteer' ? 'متطوع' : (currentRole === 'association' ? 'جمعية' : 'إدارة'));
            document.getElementById('submitBtn').innerText = isLogin ? 'الدخول للمنصة' : 'إنشاء الحساب';

            if(isLogin) {
                document.getElementById('tabLogin').classList.add('active');
                document.getElementById('tabSignup').classList.remove('active');
                document.getElementById('nameField').classList.add('hidden-app');
            } else {
                document.getElementById('tabSignup').classList.add('active');
                document.getElementById('tabLogin').classList.remove('active');
                document.getElementById('nameField').classList.remove('hidden-app');
            }
        }

        function processAuth() {
            let email = document.getElementById('inpEmail').value.trim();
            let pass = document.getElementById('inpPass').value.trim();
            let name = document.getElementById('inpName').value.trim();

            if(!email || !pass) {
                document.getElementById('authMsg').innerText = "يرجى تعبئة الحقول المطلوبة";
                document.getElementById('authMsg').className = "text-center text-sm font-bold mt-2 text-red-500";
                return;
            }

            if(currentRole === 'admin') {
                localStorage.setItem('majaz_session', JSON.stringify({role: 'admin', name: 'المدير العام'}));
                window.location.href = 'admin.html';
                return;
            }

            if(isLogin) {
                let user = users.find(u => u.role === currentRole && u.email === email && u.pass === pass);
                if(user) {
                    localStorage.setItem('majaz_session', JSON.stringify(user));
                    window.location.href = user.role === 'volunteer' ? 'volunteer.html' : 'association.html';
                } else {
                    document.getElementById('authMsg').innerText = "البيانات غير صحيحة أو الحساب غير موجود";
                    document.getElementById('authMsg').className = "text-center text-sm font-bold mt-2 text-red-500";
                }
            } else {
                if(users.find(u => u.email === email)) {
                    document.getElementById('authMsg').innerText = "هذا البريد مستخدم مسبقاً";
                    document.getElementById('authMsg').className = "text-center text-sm font-bold mt-2 text-red-500";
                    return;
                }
                let newUser = { id: Date.now(), role: currentRole, name: name, email: email, pass: pass, hours: 0 };
                users.push(newUser);
                localStorage.setItem('majaz_users', JSON.stringify(users));
                localStorage.setItem('majaz_session', JSON.stringify(newUser));
                
                document.getElementById('authMsg').innerText = "تم الإنشاء! جاري الدخول...";
                document.getElementById('authMsg').className = "text-center text-sm font-bold mt-2 text-emerald-500";
                
                setTimeout(() => {
                    window.location.href = newUser.role === 'volunteer' ? 'volunteer.html' : 'association.html';
                }, 1000);
            }
        }

        window.onload = () => {
            let session = JSON.parse(localStorage.getItem('majaz_session'));
            if(session) {
                if(session.role === 'volunteer') window.location.href = 'volunteer.html';
                if(session.role === 'association') window.location.href = 'association.html';
                if(session.role === 'admin') window.location.href = 'admin.html';
            }
        }
    </script>
</body>
</html>
