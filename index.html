<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مجاز | الصفحة الرئيسية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Cairo', 'sans-serif'] },
                    colors: {
                        primary: '#4c1d95', 
                        secondary: '#f59e0b', 
                        dark: '#1e1b4b'
                    }
                }
            }
        }
    </script>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4c1d95">
    
    <style>
        .hidden-app { display: none !important; }
        .tab-btn.active { color: #f59e0b; border-bottom-color: #f59e0b; }
        .tab-btn { color: #cbd5e1; border-bottom-color: transparent; }
        .img-overlay { background: linear-gradient(to top, rgba(46, 16, 101, 0.95) 0%, rgba(76, 29, 149, 0.5) 50%, rgba(0,0,0,0) 100%); }
        /* أنيميشن للنافذة المنبثقة */
        @keyframes popIn {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .modal-animate { animation: popIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen flex flex-col selection:bg-secondary selection:text-white">

    <div class="flex-1 flex flex-col relative overflow-hidden pb-12 bg-gradient-to-br from-[#2e1065] via-[#581c87] to-[#1e1b4b]">
        
        <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-secondary rounded-full blur-[130px] opacity-20 z-0 pointer-events-none"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[500px] h-[500px] bg-[#8b5cf6] rounded-full blur-[130px] opacity-15 z-0 pointer-events-none"></div>

        <div class="absolute inset-0 z-0 pointer-events-none opacity-[0.03]" style="background-image: url('logo.png'); background-size: 150px; background-repeat: repeat;"></div>

        <nav class="w-full px-4 md:px-6 py-4 flex flex-wrap justify-between items-center relative z-10 gap-y-4">
            
            <div class="flex items-center gap-2 md:gap-3">
                <div class="w-20 h-20 md:w-28 md:h-28 flex items-center justify-center relative overflow-visible">
                    <img src="logo.png" alt="شعار مجاز" class="w-full h-full object-contain drop-shadow-xl scale-125">
                </div>
            </div>
            
            <div class="flex items-center gap-2 md:gap-3">
                <button onclick="toggleInfoModal()" class="flex items-center gap-2 bg-secondary/20 hover:bg-secondary/30 text-secondary border border-secondary/30 rounded-lg px-3 py-2 md:px-4 md:py-2.5 backdrop-blur-md transition text-xs md:text-sm font-bold shadow-lg">
                    <i class="fa-solid fa-lightbulb"></i>
                    <span class="hidden md:inline">اكتشف منصة مجاز</span>
                    <span class="md:hidden">عن المنصة</span>
                </button>

                <button onclick="openAuth('admin')" class="flex items-center gap-2 bg-white/10 hover:bg-white/20 text-white border border-white/20 rounded-lg px-3 py-2 md:px-4 md:py-2.5 backdrop-blur-md transition text-xs md:text-sm font-bold shadow-lg">
                    <i class="fa-solid fa-shield-halved text-secondary"></i>
                    <span>الإدارة</span>
                </button>
            </div>
        </nav>

        <div class="container mx-auto px-6 text-center relative z-10 mt-6 md:mt-12 mb-8">
            <span class="inline-block py-1.5 px-5 rounded-full bg-black/10 text-secondary font-bold text-xs md:text-sm mb-6 border border-secondary/30 backdrop-blur-md shadow-lg">
                ✨ المنصة الأولى للعمل المجتمعي
            </span>
            
            <h1 class="text-3xl md:text-5xl lg:text-6xl font-black text-white leading-tight mb-4 drop-shadow-2xl flex flex-col md:flex-row justify-center items-center gap-2 md:gap-4">
                <span>بوابتك للأثر..</span> <span class="text-secondary">ولمستقبلك المهني</span>
            </h1>
            
            <p class="text-base md:text-xl text-purple-100 max-w-2xl mx-auto leading-relaxed drop-shadow-md font-medium mt-4">
                صور حية، توثيق معتمد، ومجتمع ينبض بالعطاء.
            </p>
        </div>

        <div class="container mx-auto px-6 text-center relative z-10 mb-6">
            <div class="inline-flex items-center gap-3 bg-white/10 backdrop-blur-md border border-white/20 rounded-full px-6 py-2.5 shadow-lg">
                <span class="text-secondary text-lg"><i class="fa-solid fa-hand-point-down"></i></span>
                <span class="text-white font-bold text-sm md:text-base">حدد صفتك أدناه للدخول إلى المنصة</span>
            </div>
        </div>

        <div class="container mx-auto px-6 flex flex-col md:flex-row justify-center items-center gap-6 md:gap-8 max-w-4xl relative z-10">
            
            <div onclick="openAuth('volunteer')" class="w-full md:w-1/2 group relative h-72 md:h-96 rounded-3xl overflow-hidden cursor-pointer shadow-2xl hover:-translate-y-2 transition duration-300 border-2 border-white/10 hover:border-secondary">
                <img src="https://images.unsplash.com/photo-1582213782179-e0d53f98f2ca?auto=format&fit=crop&w=800&q=80" alt="Volunteer" class="absolute inset-0 w-full h-full object-cover group-hover:scale-105 transition duration-500">
                <div class="absolute inset-0 img-overlay transition duration-300 group-hover:bg-primaryDark/80"></div>
                <div class="absolute inset-0 p-6 flex flex-col justify-end items-center text-center pb-10">
                    <div class="w-16 h-16 md:w-20 md:h-20 bg-secondary/95 backdrop-blur-sm rounded-full flex items-center justify-center mb-4 shadow-[0_0_20px_rgba(251,191,36,0.4)] group-hover:scale-110 transition duration-300">
                        <i class="fa-solid fa-hand-holding-heart text-3xl md:text-4xl text-primaryDark"></i>
                    </div>
                    <h3 class="text-2xl md:text-3xl font-black text-white mb-1">الدخول كمتطوع</h3>
                    <p class="text-white/80 font-bold text-xs md:text-sm">ابنِ سيرتك الذاتية ووثق ساعاتك</p>
                </div>
            </div>

            <div onclick="openAuth('association')" class="w-full md:w-1/2 group relative h-72 md:h-96 rounded-3xl overflow-hidden cursor-pointer shadow-2xl hover:-translate-y-2 transition duration-300 border-2 border-white/10 hover:border-secondary">
                <img src="https://images.unsplash.com/photo-1531206715517-5c0ba140b2b8?auto=format&fit=crop&w=800&q=80" alt="Association" class="absolute inset-0 w-full h-full object-cover group-hover:scale-105 transition duration-500">
                <div class="absolute inset-0 img-overlay transition duration-300 group-hover:bg-primaryDark/80"></div>
                <div class="absolute inset-0 p-6 flex flex-col justify-end items-center text-center pb-10">
                    <div class="w-16 h-16 md:w-20 md:h-20 bg-white/95 backdrop-blur-sm rounded-full flex items-center justify-center mb-4 shadow-[0_0_20px_rgba(255,255,255,0.2)] group-hover:scale-110 transition duration-300">
                        <i class="fa-solid fa-building-ngo text-3xl md:text-4xl text-primary"></i>
                    </div>
                    <h3 class="text-2xl md:text-3xl font-black text-white mb-1">الدخول كجمعية</h3>
                    <p class="text-white/80 font-bold text-xs md:text-sm">انشر فرصك وأدر المتطوعين باحترافية</p>
                </div>
            </div>

        </div>
    </div>

    <div id="infoModal" class="fixed inset-0 bg-dark/80 backdrop-blur-sm z-[100] hidden flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-2xl overflow-hidden relative modal-animate my-8">
            <button onclick="toggleInfoModal()" class="absolute top-4 right-4 md:top-6 md:right-6 text-white hover:text-red-300 transition text-2xl z-10 w-10 h-10 bg-black/30 backdrop-blur-sm rounded-full flex items-center justify-center">
                <i class="fa-solid fa-xmark"></i>
            </button>
            
            <div class="w-full h-48 md:h-64 relative">
                <img src="
