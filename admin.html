<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مجاز | لوحة تحكم الإدارة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Cairo', 'sans-serif'] },
                    colors: {
                        primary: '#6b21a8',
                        primaryDark: '#4c1d95',
                        secondary: '#fbbf24',
                        dark: '#0f172a',
                        surface: '#f8fafc'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f1f5f9; }
        .glass-card { background: white; border: 1px solid #e2e8f0; border-radius: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02); transition: all 0.3s ease; }
        .glass-card:hover { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05); }
        .sidebar-item { transition: all 0.2s; border-right: 4px solid transparent; }
        .sidebar-item:hover { background-color: rgba(255,255,255,0.05); }
        .sidebar-item.active { background-color: rgba(255,255,255,0.1); border-right-color: #fbbf24; color: white; font-weight: bold; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="font-sans text-slate-800 flex h-screen overflow-hidden">

    <!-- القائمة الجانبية -->
    <aside class="w-72 bg-dark text-slate-300 flex flex-col flex-shrink-0 relative z-20 shadow-2xl border-l border-white/5">
        <div class="h-24 flex items-center px-8 border-b border-white/10 bg-black/20">
            <i class="fa-solid fa-shield-halved text-4xl text-secondary ml-3 shadow-sm"></i>
            <span class="text-3xl font-black text-white tracking-wide">مجاز</span>
        </div>

        <div class="p-6 border-b border-white/10">
            <div class="flex items-center gap-4">
                <div class="w-14 h-14 bg-gradient-to-br from-secondary to-orange-500 rounded-2xl flex items-center justify-center text-dark font-bold text-2xl shadow-lg">
                    <i class="fa-solid fa-user-tie"></i>
                </div>
                <div>
                    <h3 class="text-white font-bold text-lg truncate w-40" id="adminName">المدير العام</h3>
                    <p class="text-xs text-emerald-400 mt-1 font-bold">النظام يعمل <i class="fa-solid fa-signal ml-1"></i></p>
                </div>
            </div>
        </div>

        <nav class="flex-1 py-6 px-4 space-y-2 overflow-y-auto custom-scrollbar">
            <a href="#" class="sidebar-item active flex items-center gap-3 px-4 py-3 rounded-xl text-sm">
                <i class="fa-solid fa-chart-line w-6 text-center text-lg"></i> نظرة عامة
            </a>
            <a href="#" class="sidebar-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm text-slate-400 hover:text-white">
                <i class="fa-solid fa-building-ngo w-6 text-center text-lg"></i> إدارة الجمعيات
            </a>
            <a href="#" class="sidebar-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm text-slate-400 hover:text-white">
                <div class="flex items-center gap-3"><i class="fa-solid fa-users w-6 text-center text-lg"></i> قاعدة المتطوعين</div>
            </a>
            <a href="#" class="sidebar-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm text-slate-400 hover:text-white">
                <i class="fa-solid fa-file-contract w-6 text-center text-lg"></i> التقارير الشاملة
            </a>
        </nav>

        <div class="p-4 border-t border-white/10">
            <button onclick="logout()" class="w-full flex items-center justify-center gap-2 bg-white/5 hover:bg-rose-500 hover:text-white transition py-3 rounded-xl text-sm font-bold">
                <i class="fa-solid fa-power-off"></i> إنهاء الجلسة
            </button>
        </div>
    </aside>

    <!-- المحتوى الرئيسي -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden bg-surface relative">
        <header class="h-20 bg-white border-b border-slate-200 flex items-center justify-between px-8 flex-shrink-0 z-10">
            <h2 class="text-2xl font-black text-slate-800">اللوحة المركزية للإدارة</h2>
            <button class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:bg-slate-200 transition">
                <i class="fa-solid fa-bell"></i>
            </button>
        </header>

        <div class="flex-1 overflow-y-auto p-8 custom-scrollbar">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="glass-card p-6 flex items-center gap-6 border-r-4 border-r-primary">
                    <div class="w-16 h-16 rounded-full bg-purple-100 flex items-center justify-center"><i class="fa-solid fa-users text-2xl text-primary"></i></div>
                    <div><h3 class="text-slate-500 font-bold mb-1">إجمالي المتطوعين</h3><span class="text-3xl font-black text-dark">1,245</span></div>
                </div>
                <div class="glass-card p-6 flex items-center gap-6 border-r-4 border-r-secondary">
                    <div class="w-16 h-16 rounded-full bg-yellow-100 flex items-center justify-center"><i class="fa-solid fa-building-ngo text-2xl text-secondary"></i></div>
                    <div><h3 class="text-slate-500 font-bold mb-1">الجمعيات المعتمدة</h3><span class="text-3xl font-black text-dark">42</span></div>
                </div>
                <div class="glass-card p-6 flex items-center gap-6 border-r-4 border-r-emerald-500">
                    <div class="w-16 h-16 rounded-full bg-emerald-100 flex items-center justify-center"><i class="fa-solid fa-clock text-2xl text-emerald-500"></i></div>
                    <div><h3 class="text-slate-500 font-bold mb-1">ساعات الأثر الكلية</h3><span class="text-3xl font-black text-dark">8,900</span></div>
                </div>
            </div>
            
            <div class="glass-card p-8">
                <h3 class="text-xl font-black text-slate-800 mb-6">نشاط المنصة الأخير</h3>
                <div class="space-y-4">
                    <div class="flex items-center gap-4 bg-slate-50 p-4 rounded-xl border border-slate-100">
                        <div class="w-3 h-3 rounded-full bg-green-500"></div>
                        <p class="font-bold text-sm">تم تسجيل متطوع جديد <span class="text-slate-500">(منذ 5 دقائق)</span></p>
                    </div>
                    <div class="flex items-center gap-4 bg-slate-50 p-4 rounded-xl border border-slate-100">
                        <div class="w-3 h-3 rounded-full bg-blue-500"></div>
                        <p class="font-bold text-sm">نشرت "جمعية الأمل" فرصة تطوعية جديدة <span class="text-slate-500">(منذ 15 دقيقة)</span></p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        function logout() {
            localStorage.removeItem('majaz_session');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
